  supplies:
    label: "Supplies"
    description: "Consumables, office, cleaning"
    icon: "shopping-bag"
    account: supplies
  marketing:
    label: "Marketing"
    description: "Ads, flyers, promotion"
    icon: "megaphone"
    account: marketing
  travel:
    label: "Travel"
    description: "Transportation, parking, lodging"
    icon: "truck"
    account: travel
  food:
    label: "Food and drink"
    description: "Catering, the green room, a cast party"
    icon: "cake"
    account: food_and_drink
  licensing:
    label: "Licensing and rights"
    description: "Music, script and performance rights"
    icon: "document-text"
    account: licensing
  insurance:
    label: "Insurance"
    icon: "shield-check"
    account: insurance
  professional:
    label: "Accounting and legal"
    description: "The accountant, the lawyer, the bookkeeper"
    icon: "document-text"
    account: professional_services
  software:
    label: "Software and subscriptions"
    description: "CocoScout, your website, the tools you pay for monthly"
