# Solid Cache and Solid Queue live in the SAME database as everything else —
# their entries here exist only to point at their own migrations_paths, not at
# a separate database. So they have no schema of their own to dump: Rails would
# connect, see the whole shared database, and write a full copy of the primary
# schema to db/cache_schema.rb and db/queue_schema.rb on every migration.
#
# schema_dump: false stops that. It also stops db:prepare trying to load those
# files, which is right — db/schema.rb already carries the solid_cache_* and
# solid_queue_* tables, because it's dumped from the same database.
#
# If cache or queue ever move to a database of their own, drop the flag and let
# Rails dump them again.
postgres_default: &postgres_default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("DB_POOL") { ENV.fetch("RAILS_MAX_THREADS") { 5 } } %>
  prepared_statements: false
  schema_search_path: "public"

development:
  primary:
    <<: *postgres_default
    database: cocoscout_development
    host: localhost
  cache:
    <<: *postgres_default
    database: cocoscout_development
    host: localhost
    migrations_paths: db/cache_migrate
    schema_dump: false
  queue:
    <<: *postgres_default
    database: cocoscout_development
    host: localhost
    migrations_paths: db/queue_migrate
    schema_dump: false

test:
  primary:
    <<: *postgres_default
    database: cocoscout_test
    host: localhost
  cache:
    <<: *postgres_default
    database: cocoscout_test
    host: localhost
    migrations_paths: db/cache_migrate
    schema_dump: false
  queue:
    <<: *postgres_default
    database: cocoscout_test
    host: localhost
    migrations_paths: db/queue_migrate
    schema_dump: false

production:
  primary:
    adapter: postgresql
    encoding: unicode
    pool: <%= ENV.fetch("DB_POOL") { ENV.fetch("RAILS_MAX_THREADS") { 5 } } %>
    prepared_statements: false
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *postgres_default
    url: <%= ENV["DATABASE_URL"] %>
    migrations_paths: db/cache_migrate
    schema_dump: false
  queue:
    <<: *postgres_default
    url: <%= ENV["DATABASE_URL"] %>
    migrations_paths: db/queue_migrate
    schema_dump: false