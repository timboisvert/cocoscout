[versions]
agp = "9.2.0"
kotlin = "2.2.10"
hotwire = "1.3.2"
composeBom = "2026.02.01"
activityCompose = "1.10.1"
materialIcons = "1.7.8"
material = "1.12.0"
serialization = "1.9.0"
coil = "2.7.0"
lifecycle = "2.9.4"
browser = "1.8.0"

[libraries]
hotwire-core = { group = "dev.hotwire", name = "core", version.ref = "hotwire" }
hotwire-navigation = { group = "dev.hotwire", name = "navigation-fragments", version.ref = "hotwire" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-icons = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIcons" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
