# Name of your application. Used to uniquely configure containers.
service: cocoscout

# Name of the container image (ECR in us-east-2).
image: cocoscout

# Deploy to these servers.
servers:
  web:
    hosts:
      - web1.deploy.cocoscout.com # CocoScout Web 1 (EIP 18.219.90.207, i-063c05931ddd1e203)
      - web2.deploy.cocoscout.com # CocoScout Web 2 (EIP 3.21.119.92, i-0e719ed332f5b9800)
    options:
      memory: 3g  # Limit to leave headroom on 4GB instance
    env:
      clear:
        WEB_CONCURRENCY: 2  # Puma workers — t4g.medium has 2 vCPUs; 2 workers × RAILS_MAX_THREADS threads each
        RAILS_MAX_THREADS: 6
        DB_POOL: 6
  job:
    hosts:
      - jobs.deploy.cocoscout.com # CocoScout Jobs (EIP 16.58.32.48, i-06a86efae7d1fda65)
    cmd: bin/jobs
    proxy: false
    options:
      health-cmd: "true"
      health-interval: 2s
      health-timeout: 5s
      health-retries: 3
      health-start-period: 5s
      memory: 1200m  # Limit to leave headroom on 2GB instance
    env:
      clear:
        JOB_CONCURRENCY: 2  # Solid Queue workers
        DB_POOL: 8  # Jobs need more connections

ssh:
  user: ec2-user
  keys: [ "~/.ssh/Tim.pem" ]

# Deploy to all hosts in parallel (instead of one at a time)
boot:
  limit: 100%

# Faster health checks for quicker rollouts
proxy:
  healthcheck:
    interval: 1
    timeout: 2

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# Remove this section when using multiple web servers and ensure you terminate SSL at your load balancer.
#
# Note: If using Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
# proxy:
#   ssl: false
#   hosts:
#     - cocoscout.com
#     - www.cocoscout.com

# ECR registry (password fetched dynamically via AWS CLI)
registry:
  server: 769979514680.dkr.ecr.us-east-2.amazonaws.com
  username: AWS
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - AWS_REGION
    - MAILGUN_API_KEY
    - SENTRY_DSN
    - REDIS_URL
    - STRIPE_SECRET_KEY
    - STRIPE_WEBHOOK_SECRET
    # Connect endpoint's own signing secret (payee events: account.updated,
    # payout.failed). Stripe issues one secret per endpoint.
    - STRIPE_CONNECT_WEBHOOK_SECRET
    - STRIPE_PRICE_PRO_MONTHLY
    - STRIPE_PRICE_PRO_ANNUAL
    - STRIPE_PRICE_STAFF_ACTIVE
    - STRIPE_METER_STAFF_ACTIVE
    - STRIPE_PRICE_PERFORMER_ACTIVE
    - STRIPE_METER_PERFORMER_ACTIVE
  clear:
    # Job processing is handled by the dedicated job server (bin/jobs)
    SOLID_QUEUE_IN_PUMA: false

    RAILS_ENV: production

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
  ps: app exec "ps aux"
  # One-off, idempotent deploy tasks — run once on the primary host.
  seed-content-templates: app exec -p --reuse "bin/rails content_templates:ensure_contract_templates"

# Automatically clean up old images/containers after deploy
retain_containers: 2

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch:
    - arm64
  cache:
    type: registry
