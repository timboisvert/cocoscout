# Production genres — the "what are you creating?" answer from producer setup.
# Keys are stored in productions.genre, so renaming one requires a data
# migration; keep them generic.

production_genres:
  sketch:
    icon: "pencil-square"
    label: "Sketch comedy"
    description: "A sketch team writing and performing scripted comedy"
    noun: "team"
    name_placeholder: "e.g., The Late Shift"
  improv:
    icon: "bolt"
    label: "Improv"
    description: "An improv team or house ensemble"
    noun: "team"
    name_placeholder: "e.g., Fourth Wall"
  standup:
    icon: "microphone"
    label: "Standup"
    description: "A standup showcase, open mic, or comedy night"
    noun: "showcase"
    name_placeholder: "e.g., Late Night Laughs"
  theater:
    icon: "ticket"
    label: "Theater"
    description: "A play, musical, or theatrical production"
    noun: "production"
    name_placeholder: "e.g., The Glass House"
  variety:
    icon: "sparkles"
    label: "Variety / cabaret"
    description: "A variety show, cabaret, burlesque, or mixed-bill night"
    noun: "show"
    name_placeholder: "e.g., The Saturday Special"
  other:
    icon: "squares-plus"
    label: "Something else"
    description: "Any other kind of show or event series"
    noun: "production"
    name_placeholder: "e.g., My Next Big Thing"
